services:
  leviathan:
    build:
      context: .
      dockerfile: Dockerfile
    ipc: host
    container_name: leviathan
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/home/ubuntu/.2026-27WaterCode
      - /dev:/dev
    privileged: true
    network_mode: host
    shm_size: '8gb'
    user: ubuntu
    command: tail -f /dev/null
